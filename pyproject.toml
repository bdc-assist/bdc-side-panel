[project]
name = "bdc-side-panel"
version = "0.1.0"
description = "BDC Assist's side panel backend: drafts BDC site forms from the chat (bdc-assist#64, #66)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# not installed — run from the repo root (same convention as bdc-assist)
[tool.pytest.ini_options]
pythonpath = ["."]
